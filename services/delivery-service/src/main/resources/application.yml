server:
  port: 8083

openapi:
  info:
    title: FulfillFlow Delivery Service API
    description: Manages courier dispatch, delivery scheduling, and delivery lifecycle events.

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${DELIVERY_DB_HOST:localhost}:${DELIVERY_DB_PORT:5432}/fulfillflow_delivery
    username: ${DELIVERY_DB_USER:delivery_service}
    password: ${DELIVERY_DB_PASSWORD:delivery-dev-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/fulfillflow/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/fulfillflow
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:29092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: delivery-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fulfillflow.*"
        spring.json.value.default.type: com.fulfillflow.common.events.EventEnvelope
    listener:
      ack-mode: manual_immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.fulfillflow: INFO
