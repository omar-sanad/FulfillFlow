# FulfillFlow local development compose foundation.
#
# This file establishes the infrastructure layer (PostgreSQL, Kafka in KRaft
# mode, Keycloak) with health checks and dependency readiness. Backend services
# and the frontend are added in later milestones under `services` and `frontend`
# profiles. The monitoring stack (Prometheus, Grafana, Jaeger, OTel collector)
# is added under the `monitoring` profile.
#
# Each service owns its own logical PostgreSQL database and credentials.
# Variables are sourced from .env (see .env.example).

name: fulfillflow

services:
  # --------------------------------------------------------------------------
  # PostgreSQL -- shared instance, one logical database per service
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: fulfillflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-fulfillflow-dev}
      # Per-service databases are created via an init script in a later
      # milestone. Kept minimal here for the foundation.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fulfillflow

  # --------------------------------------------------------------------------
  # Apache Kafka in KRaft mode (no ZooKeeper)
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: fulfillflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: fulfillflow-kraft-cluster
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fulfillflow

  # --------------------------------------------------------------------------
  # Keycloak -- OAuth2 / OIDC identity provider
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: fulfillflow-keycloak
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - fulfillflow

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:

networks:
  fulfillflow:
    driver: bridge
