# FulfillFlow local development compose foundation.
#
# This file establishes the infrastructure layer (PostgreSQL, Kafka in KRaft
# mode, Keycloak) with health checks and dependency readiness. Backend services
# and the frontend are added in later milestones under `services` and `frontend`
# profiles. The monitoring stack (Prometheus, Grafana, Jaeger, OTel collector)
# is added under the `monitoring` profile.
#
# Each service owns its own logical PostgreSQL database and credentials.
# Variables are sourced from .env (see .env.example).

name: fulfillflow

services:
  # --------------------------------------------------------------------------
  # PostgreSQL -- shared instance, one logical database per service
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: fulfillflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-fulfillflow-dev}
      POSTGRES_DB: fulfillflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infrastructure/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/02-init-databases.sh:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "psql -U ${POSTGRES_SUPERUSER:-postgres} -d fulfillflow_order -c 'select 1' >/dev/null 2>&1 && psql -U ${POSTGRES_SUPERUSER:-postgres} -d fulfillflow_inventory -c 'select 1' >/dev/null 2>&1 && psql -U ${POSTGRES_SUPERUSER:-postgres} -d fulfillflow_delivery -c 'select 1' >/dev/null 2>&1 && psql -U ${POSTGRES_SUPERUSER:-postgres} -d fulfillflow_notification -c 'select 1' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fulfillflow

  # --------------------------------------------------------------------------
  # Apache Kafka in KRaft mode (no ZooKeeper)
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: fulfillflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: fulfillflow-kraft-cluster
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fulfillflow

  # --------------------------------------------------------------------------
  # Kafka topic provisioning (runs once after the broker is healthy)
  # --------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: fulfillflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/provision-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infrastructure/docker/kafka/provision-topics.sh:/provision-topics.sh:ro
    restart: "no"
    networks:
      - fulfillflow

  # --------------------------------------------------------------------------
  # Keycloak -- OAuth2 / OIDC identity provider
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: fulfillflow-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/fulfillflow/.well-known/openid-configuration HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm/fulfillflow-realm.json:/opt/keycloak/data/import/fulfillflow-realm.json:ro
    networks:
      - fulfillflow

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:

networks:
  fulfillflow:
    driver: bridge
