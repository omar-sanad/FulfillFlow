<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FulfillFlow system architecture</title>
  <desc id="desc">React frontend secured by Keycloak communicating with four Spring Boot services, Kafka, and service-owned PostgreSQL databases.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#0f172a}.section{font:700 16px Arial,sans-serif;fill:#475569}.label{font:700 16px Arial,sans-serif;fill:#0f172a}.sub{font:13px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">FulfillFlow System Architecture</text>

  <rect x="45" y="82" width="1110" height="112" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="110" class="section">CLIENT AND IDENTITY</text>
  <rect x="120" y="126" width="250" height="48" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="245" y="148" text-anchor="middle" class="label">React + TypeScript</text><text x="245" y="165" text-anchor="middle" class="sub">Vite frontend · :5173</text>
  <rect x="830" y="126" width="250" height="48" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="955" y="148" text-anchor="middle" class="label">Keycloak</text><text x="955" y="165" text-anchor="middle" class="sub">OAuth2 / OIDC · :8080</text>
  <path d="M370 150 H830" class="line"/><text x="600" y="140" text-anchor="middle" class="sub">authentication</text>

  <rect x="45" y="224" width="1110" height="190" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="68" y="252" class="section">SPRING BOOT MICROSERVICES · REST + JWT</text>
  <g>
    <rect x="80" y="286" width="235" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="197" y="318" text-anchor="middle" class="label">Order Service</text><text x="197" y="342" text-anchor="middle" class="sub">Orders and lifecycle · :8081</text>
    <rect x="350" y="286" width="235" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="467" y="318" text-anchor="middle" class="label">Inventory Service</text><text x="467" y="342" text-anchor="middle" class="sub">Products and stock · :8082</text>
    <rect x="620" y="286" width="235" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="737" y="318" text-anchor="middle" class="label">Delivery Service</text><text x="737" y="342" text-anchor="middle" class="sub">Delivery lifecycle · :8083</text>
    <rect x="890" y="286" width="235" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="1007" y="318" text-anchor="middle" class="label">Notification Service</text><text x="1007" y="342" text-anchor="middle" class="sub">Notification records · :8084</text>
  </g>
  <path d="M245 174 V210 H197 V286" class="line"/><path d="M245 174 V210 H467 V286" class="line"/><path d="M245 174 V210 H737 V286" class="line"/><path d="M245 174 V210 H1007 V286" class="line"/>
  <path d="M955 174 V270" class="dash"/><text x="970" y="230" class="sub">JWT verification</text>

  <rect x="390" y="450" width="420" height="88" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="485" text-anchor="middle" class="label">Apache Kafka · KRaft mode</text><text x="600" y="510" text-anchor="middle" class="sub">Versioned domain topics · asynchronous events</text>
  <path d="M197 368 V430 H465 V450" class="line"/><path d="M467 368 V450" class="line"/><path d="M737 368 V450" class="line"/><path d="M1007 368 V430 H735 V450" class="line"/>

  <rect x="45" y="576" width="1110" height="142" rx="16" fill="#fdf4ff" stroke="#d8b4fe"/>
  <text x="68" y="604" class="section">SERVICE-OWNED POSTGRESQL DATABASES</text>
  <g>
    <rect x="80" y="628" width="235" height="54" rx="12" fill="#fff" stroke="#a855f7"/><text x="197" y="660" text-anchor="middle" class="label">Order DB</text>
    <rect x="350" y="628" width="235" height="54" rx="12" fill="#fff" stroke="#a855f7"/><text x="467" y="660" text-anchor="middle" class="label">Inventory DB</text>
    <rect x="620" y="628" width="235" height="54" rx="12" fill="#fff" stroke="#a855f7"/><text x="737" y="660" text-anchor="middle" class="label">Delivery DB</text>
    <rect x="890" y="628" width="235" height="54" rx="12" fill="#fff" stroke="#a855f7"/><text x="1007" y="660" text-anchor="middle" class="label">Notification DB</text>
  </g>
  <path d="M197 368 V628" class="line"/><path d="M467 538 V628" class="line"/><path d="M737 538 V628" class="line"/><path d="M1007 368 V628" class="line"/>
</svg>
