<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Successful FulfillFlow order workflow</title>
  <desc id="desc">A successful order travels from the customer through order creation, inventory reservation, payment, delivery, notifications, and fulfilment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.title{font:700 25px Arial,sans-serif;fill:#0f172a}.head{font:700 15px Arial,sans-serif;fill:#0f172a}.text{font:13px Arial,sans-serif;fill:#334155}.life{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5 5}.flow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.event{font:700 12px Arial,sans-serif;fill:#7c3aed}</style>
  </defs>
  <rect width="1400" height="500" rx="20" fill="#f8fafc"/>
  <text x="700" y="40" text-anchor="middle" class="title">Successful Order Workflow</text>
  <g>
    <rect x="40" y="70" width="150" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="115" y="97" text-anchor="middle" class="head">Customer</text>
    <rect x="235" y="70" width="150" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="310" y="97" text-anchor="middle" class="head">React UI</text>
    <rect x="430" y="70" width="150" height="44" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="505" y="97" text-anchor="middle" class="head">Order</text>
    <rect x="625" y="70" width="150" height="44" rx="10" fill="#ffedd5" stroke="#f97316"/><text x="700" y="97" text-anchor="middle" class="head">Kafka</text>
    <rect x="820" y="70" width="150" height="44" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="895" y="97" text-anchor="middle" class="head">Inventory</text>
    <rect x="1015" y="70" width="150" height="44" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="1090" y="97" text-anchor="middle" class="head">Delivery</text>
    <rect x="1210" y="70" width="150" height="44" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="1285" y="97" text-anchor="middle" class="head">Notification</text>
  </g>
  <g class="life"><path d="M115 114 V470"/><path d="M310 114 V470"/><path d="M505 114 V470"/><path d="M700 114 V470"/><path d="M895 114 V470"/><path d="M1090 114 V470"/><path d="M1285 114 V470"/></g>
  <path d="M115 145 H310" class="flow"/><text x="212" y="138" text-anchor="middle" class="text">Place order</text>
  <path d="M310 180 H505" class="flow"/><text x="407" y="173" text-anchor="middle" class="text">POST /api/orders</text>
  <rect x="455" y="194" width="100" height="34" rx="7" fill="#fff" stroke="#22c55e"/><text x="505" y="215" text-anchor="middle" class="text">Save + outbox</text>
  <path d="M505 246 H700" class="flow"/><text x="602" y="239" text-anchor="middle" class="event">order.created</text>
  <path d="M700 278 H895" class="flow"/><text x="797" y="271" text-anchor="middle" class="event">order.created</text>
  <rect x="845" y="292" width="100" height="34" rx="7" fill="#fff" stroke="#22c55e"/><text x="895" y="313" text-anchor="middle" class="text">Reserve stock</text>
  <path d="M895 342 H700" class="flow"/><text x="797" y="335" text-anchor="middle" class="event">inventory.reserved</text>
  <path d="M115 372 H505" class="flow"/><text x="310" y="365" text-anchor="middle" class="text">Pay order</text>
  <path d="M505 400 H700" class="flow"/><text x="602" y="393" text-anchor="middle" class="event">order.paid</text>
  <path d="M700 428 H1090" class="flow"/><text x="895" y="421" text-anchor="middle" class="event">order.paid → delivery.scheduled</text>
  <path d="M1090 456 H700" class="flow"/><text x="895" y="449" text-anchor="middle" class="event">delivery.completed</text>
  <path d="M700 474 H505" class="flow"/><path d="M700 474 H1285" class="flow"/>
</svg>
